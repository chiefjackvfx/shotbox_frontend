[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shotbox-matte"
version = "0.1.0"
description = "Shotbox frontend native LTX Alpha Gen matte backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=11,<13",
    "OpenImageIO>=3.0,<4",
    "av>=15,<20",
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.8,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11"]
inference = [
    "ltx-core @ git+https://github.com/Lightricks/LTX-2.git@e98f6d927d83c92ef2be6aec76c8440b19306e39#subdirectory=packages/ltx-core",
    "ltx-pipelines @ git+https://github.com/Lightricks/LTX-2.git@e98f6d927d83c92ef2be6aec76c8440b19306e39#subdirectory=packages/ltx-pipelines",
]

[tool.setuptools.packages.find]
include = ["shotbox_matte*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
